<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読み込み中... | 超三元</title>
<meta name="description" content="超三元 — ひとりのオタクが自由気ままに思うことを書くサイト。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c;
    --bg-2:#141416;
    --line:#232326;
    --ivory:#EDEBE6;
    --dim:#8a8a8f;
    --orange:#FF5A1F;
    --orange-dim:#7a3016;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);color:var(--ivory);
    font-family:"Zen Kaku Gothic New",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 28px;
    background:rgba(11,11,12,.85);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{font-weight:900;font-size:18px;letter-spacing:.14em;text-decoration:none;color:var(--ivory);}
  .brand .dot{color:var(--orange);}
  .topbar a.back{
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;
    color:var(--dim);text-decoration:none;
  }
  .topbar a.back:hover{color:var(--orange);}

  article{max-width:660px;margin:0 auto;padding:70px 24px 120px;}

  .state{
    font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);
    letter-spacing:.05em;padding:60px 4px;text-align:center;
  }
  .state.error{color:var(--orange);}

  .post-head{margin-bottom:52px;display:none;}
  .post-head .tagmark{
    display:inline-flex;align-items:center;gap:8px;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;letter-spacing:.15em;color:var(--orange);font-weight:700;
    margin-bottom:22px;
    padding-left:14px;border-left:2px solid var(--orange);
  }
  .post-head h1{
    font-weight:900;
    font-size:clamp(28px,5.5vw,42px);line-height:1.4;letter-spacing:.01em;
  }
  .post-head .meta{
    margin-top:20px;
    font-family:"JetBrains Mono",monospace;
    font-size:11.5px;color:var(--dim);letter-spacing:.05em;
  }

  .figure{margin:44px 0;position:relative;}
  .figure img{width:100%;display:block;border:1px solid var(--line);}
  .figure .ph{
    width:100%;aspect-ratio:3/2;
    background:linear-gradient(160deg,#1c1c1e,#0b0b0c);
    display:flex;align-items:center;justify-content:center;
    color:#4a4a4d;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;
    border:1px solid var(--line);
  }

  .prose{font-size:15.5px;line-height:2.3;color:var(--ivory);display:none;}
  .prose p{margin-bottom:1.7em;white-space:pre-wrap;}

  .post-foot{
    margin-top:70px;padding-top:30px;border-top:1px solid var(--line);
    display:none;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
  }
  .post-foot a{
    font-family:"JetBrains Mono",monospace;
    font-size:11.5px;font-weight:700;color:var(--dim);text-decoration:none;letter-spacing:.05em;
    transition:color .2s;
  }
  .post-foot a:hover{color:var(--orange);}

  footer{padding:44px 24px 60px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;color:var(--dim);}
  footer .fmark{font-weight:900;font-size:14px;color:var(--ivory);margin-bottom:10px;letter-spacing:.1em;font-family:"Zen Kaku Gothic New",sans-serif;}

  :focus-visible{outline:2px solid var(--orange);outline-offset:3px;}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index_super.html">超三元<span class="dot">.</span></a>
  <a class="back" href="index_super.html#log">← LOG一覧へ</a>
</div>

<article>
  <p class="state" id="state">読み込み中...</p>

  <div class="post-head" id="post-head">
    <span class="tagmark" id="p-tag"></span>
    <h1 id="p-title"></h1>
    <div class="meta" id="p-date"></div>
  </div>

  <div id="p-figure"></div>

  <div class="prose" id="p-body"></div>

  <div class="post-foot" id="post-foot">
    <a href="index_super.html#log">← LOG一覧</a>
    <a href="index_super.html">TOPへ →</a>
  </div>
</article>

<footer>
  <div class="fmark">超三元</div>
  © CHŌ SANGEN
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  /* index.html と同じCSV URLをここにも設定する */
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRe97dHcH8DKDl2s_J_tSqUuGyw-3u3GZ_h0FsEcq5KePPZU-7WgofTw8rlAnblD_NB7n0d6YEdbWfi/pub?gid=0&single=true&output=csv";

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  const stateEl = document.getElementById('state');
  const headEl = document.getElementById('post-head');
  const footEl = document.getElementById('post-foot');
  const bodyEl = document.getElementById('p-body');
  const figureEl = document.getElementById('p-figure');

  function escapeHtml(str){
    return (str||"").replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  function renderPost(row){
    if(!row){
      stateEl.textContent = "記事が見つかりませんでした。";
      stateEl.classList.add('error');
      return;
    }
    document.title = `${row.title} | 超三元`;
    document.getElementById('p-tag').textContent = row.tag || "";
    document.getElementById('p-title').textContent = row.title || "";
    document.getElementById('p-date').textContent = row.date || "";

    if(row.image_url && row.image_url.trim()){
      figureEl.innerHTML = `<figure class="figure"><img src="${escapeHtml(row.image_url)}" alt="${escapeHtml(row.title)}"></figure>`;
    }

    const paragraphs = (row.body || "").split(/\n+/).filter(p => p.trim());
    bodyEl.innerHTML = paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('');

    stateEl.style.display = 'none';
    headEl.style.display = 'block';
    bodyEl.style.display = 'block';
    footEl.style.display = 'flex';
  }

  if(!id){
    stateEl.textContent = "記事IDが指定されていません。";
    stateEl.classList.add('error');
  } else if(SHEET_CSV_URL === "YOUR_PUBLISHED_CSV_URL_HERE"){
    stateEl.textContent = "スプレッドシートのCSV URLが未設定です。";
    stateEl.classList.add('error');
  } else {
    Papa.parse(SHEET_CSV_URL, {
      download:true,
      header:true,
      skipEmptyLines:true,
      complete: (res) => {
        const row = res.data.find(r => String(r.id) === String(id));
        renderPost(row);
      },
      error: () => {
        stateEl.textContent = "記事の読み込みに失敗しました。";
        stateEl.classList.add('error');
      }
    });
  }
</script>

</body>
</html>
