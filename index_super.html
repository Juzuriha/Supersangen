<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超三元 | 柳堀花怜・今井優希・早﨑すずき</title>
<meta name="description" content="超三元 — 三人の推しだけを記録する個人ブログ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c;
    --bg-2:#141416;
    --line:#232326;
    --ivory:#EDEBE6;
    --dim:#8a8a8f;
    --orange:#FF5A1F;
    --orange-dim:#7a3016;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);color:var(--ivory);
    font-family:"Zen Kaku Gothic New",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .mono{font-family:"JetBrains Mono",monospace;}

  ::selection{background:var(--orange);color:#0b0b0c;}

  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 28px;
    background:rgba(11,11,12,.82);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{font-weight:900;font-size:18px;letter-spacing:.14em;}
  .brand .dot{color:var(--orange);}
  .topbar nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .topbar nav::-webkit-scrollbar{display:none;}
  .topbar nav a{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;letter-spacing:.1em;color:var(--dim);
    transition:color .2s;white-space:nowrap;flex-shrink:0;
  }
  .topbar nav a:hover{color:var(--orange);}

  .hero{
    position:relative;
    min-height:88vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:60px 24px;
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.04) 1px, transparent 0);
    background-size:3px 3px;
    pointer-events:none;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,.6) 100%);
    pointer-events:none;
  }

  .finder{position:relative;padding:60px 40px;}
  .corner{position:absolute;width:34px;height:34px;border-color:var(--orange);opacity:.9;}
  .corner.tl{top:0;left:0;border-top:2px solid;border-left:2px solid;}
  .corner.tr{top:0;right:0;border-top:2px solid;border-right:2px solid;}
  .corner.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid;}
  .corner.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid;}

  .rec{
    position:relative;z-index:2;
    display:inline-flex;align-items:center;gap:8px;
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;
    color:var(--orange);margin-bottom:30px;
  }
  .rec .blip{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:blip 1.6s ease-in-out infinite;}
  @keyframes blip{0%,100%{opacity:1;}50%{opacity:.25;}}

  .hero h1{
    position:relative;z-index:2;
    font-weight:900;
    font-size:clamp(52px,13vw,128px);
    line-height:.95;
    letter-spacing:.02em;
  }
  .hero h1 .accent{color:var(--orange);}

  .hero .tagline{
    position:relative;z-index:2;
    max-width:480px;margin:32px auto 0;
    font-size:clamp(15px,2.4vw,18px);
    line-height:1.9;font-weight:500;color:#d8d6d0;
    letter-spacing:.02em;
  }

  .hero .sub{
    position:relative;z-index:2;
    margin-top:22px;
    font-family:"JetBrains Mono",monospace;
    font-size:11.5px;letter-spacing:.2em;color:var(--dim);
  }
  .hero .sub b{color:var(--ivory);font-weight:500;}

  .scroll{
    position:relative;z-index:2;margin-top:60px;
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.3em;color:var(--dim);
  }
  .scroll::after{
    content:"";display:block;margin:12px auto 0;width:1px;height:32px;background:var(--orange);
    animation:drop 1.8s ease-in-out infinite;
  }
  @keyframes drop{0%{opacity:0;transform:translateY(-6px);}50%{opacity:1;}100%{opacity:0;transform:translateY(10px);}}

  section{padding:90px 24px;}
  .inner{max-width:800px;margin:0 auto;}
  .sec-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:44px;padding-bottom:16px;border-bottom:1px solid var(--line);
  }
  .sec-head h2{font-size:22px;font-weight:900;letter-spacing:.04em;}
  .sec-head h2 .sub-jp{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;font-weight:500;letter-spacing:.15em;color:var(--dim);
    margin-left:12px;
  }
  .sec-head .tag{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.2em;color:var(--orange);}

  #log{background:var(--bg);}
  .state{
    font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);
    letter-spacing:.05em;padding:30px 4px;
  }
  .state.error{color:var(--orange);}
  .log-row{
    display:grid;grid-template-columns:100px 1fr auto;gap:20px;align-items:center;
    padding:26px 4px;border-bottom:1px solid var(--line);
    position:relative;
  }
  .log-row::before{
    content:"";position:absolute;left:-4px;top:0;bottom:0;width:2px;background:transparent;
    transition:background .2s;
  }
  .log-row:hover::before{background:var(--orange);}
  .log-row:hover{background:rgba(255,90,31,.04);}
  .log-row .date{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.05em;}
  .log-row .exif{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--orange-dim);letter-spacing:.05em;display:block;margin-top:4px;}
  .log-row .body h3{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.5;}
  .log-row .body p{font-size:12.5px;color:var(--dim);line-height:1.8;}
  .log-row .tagmark{
    font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;color:var(--orange);
    white-space:nowrap;
  }
  @media (max-width:600px){
    .log-row{grid-template-columns:1fr;gap:8px;}
    .log-row .tagmark{justify-self:start;}
  }

  #about{background:var(--bg-2);border-top:1px solid var(--line);}
  #about .inner{text-align:center;}
  #about p{font-size:13.5px;line-height:2.3;color:var(--dim);max-width:540px;margin:0 auto;}
  #about p b{color:var(--ivory);font-weight:700;}
  #about .credit{margin-top:26px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.15em;color:var(--orange-dim);}

  footer{padding:44px 24px 60px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;color:var(--dim);}
  footer .fmark{font-weight:900;font-size:14px;color:var(--ivory);margin-bottom:10px;letter-spacing:.1em;font-family:"Zen Kaku Gothic New",sans-serif;}

  :focus-visible{outline:2px solid var(--orange);outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .blip,.scroll::after{animation:none;}
    .log-row{transition:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">超三元<span class="dot">.</span></div>
  <nav>
    <a href="#log">LOG</a>
    <a href="group_super.html">GROUP</a>
    <a href="sangen_super.html">SUPER SANGEN</a>
    <a href="#about">ABOUT</a>
    <a href="writer_super.html">WRITER</a>
  </nav>
</div>

<header class="hero">
  <div class="finder">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <div class="rec"><span class="blip"></span>RECORDING SINCE 2026</div>
    <h1>超<span class="accent">三</span>元</h1>
    <p class="tagline">ひとりのオタクが、自由気ままに思うことを書くサイト</p>
    <p class="sub">SUPER SANGEN GROUP</p>
  </div>
  <p class="scroll">SCROLL</p>
</header>

<section id="log">
  <div class="inner">
    <div class="sec-head">
      <h2>LOG</h2>
    </div>

    <div class="log-list" id="log-list">
      <p class="state" id="log-state">読み込み中...</p>
    </div>
  </div>
</section>

<section id="about">
  <div class="inner">
    <p>
      <b>超三元</b>とは、今井優希・早﨑すずき・柳堀花怜の三人を合わせた<b>「個人的総称」</b>。<br>
      3人を推す私が、「観て」「聴いて」感じたことを思うままに書くサイトです。
    </p>
    <p style="margin-top:22px;">
      写真はすべて撮影部として現場で撮ったもの。<br>
      ここに置くのは、ただ好きだという記録だけ。
    </p>
    <div class="credit">SHOT ON SONY α7V</div>
  </div>
</section>

<footer>
  <div class="fmark">超三元</div>
  © CHŌ SANGEN
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  /*
   * ここにGoogleスプレッドシートを「ウェブに公開 → CSV」した時に発行される
   * URLを貼るだけでLOGが自動更新される。
   * スプレッドシートの列: id, date, tag, title, excerpt, image_url, body
   */
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRe97dHcH8DKDl2s_J_tSqUuGyw-3u3GZ_h0FsEcq5KePPZU-7WgofTw8rlAnblD_NB7n0d6YEdbWfi/pub?gid=0&single=true&output=csv";

  const listEl = document.getElementById('log-list');
  const stateEl = document.getElementById('log-state');

  function escapeHtml(str){
    return (str||"").replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  function renderRows(rows){
    const valid = rows.filter(r => r.title && r.title.trim());
    if(!valid.length){
      stateEl.textContent = "まだ記事がありません。";
      return;
    }
    // 新しい日付が上に来るよう並び替え（id降順フォールバック）
    valid.sort((a,b) => {
      const da = new Date((a.date||"").replaceAll(".", "-"));
      const db = new Date((b.date||"").replaceAll(".", "-"));
      if(!isNaN(da) && !isNaN(db) && da - db !== 0) return db - da;
      return (parseInt(b.id)||0) - (parseInt(a.id)||0);
    });

    listEl.innerHTML = valid.map(r => `
      <a class="log-row" href="post-template_super.html?id=${encodeURIComponent(r.id)}">
        <span class="date">${escapeHtml(r.date)}</span>
        <span class="body">
          <h3>${escapeHtml(r.title)}</h3>
          <p>${escapeHtml(r.excerpt)}</p>
        </span>
        <span class="tagmark">${escapeHtml(r.tag)}</span>
      </a>
    `).join('');
  }

  if(SHEET_CSV_URL === "YOUR_PUBLISHED_CSV_URL_HERE"){
    stateEl.textContent = "スプレッドシートのCSV URLが未設定です（index.html内のSHEET_CSV_URLを設定してください）。";
    stateEl.classList.add('error');
  } else {
    Papa.parse(SHEET_CSV_URL, {
      download:true,
      header:true,
      skipEmptyLines:true,
      complete: (res) => renderRows(res.data),
      error: () => {
        stateEl.textContent = "記事の読み込みに失敗しました。CSVの公開設定を確認してください。";
        stateEl.classList.add('error');
      }
    });
  }
</script>

</body>
</html>
